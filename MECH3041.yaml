about_exam:
  - content: |
      考试不会考到特别冗长繁琐的公式，更多的是设计准则类。主要还是背一些重要、好记的公式。
      这门课知识点很多，但课程大纲的「了解」/「掌握」不能用来判断考试重点/范围。比如**齿轮传动的设计准则**，大纲写了解，但连续两年都考了简答。
